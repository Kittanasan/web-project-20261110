services:
  - type: web
    name: liver-fat-eval
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # หมายเหตุเรื่องที่เก็บข้อมูล:
      # - plan: free ไม่มีดิสก์ถาวร → ฐานข้อมูลอยู่ใน data/ ของโปรเจกต์ (ข้อมูลเริ่มต้น 6 ผลตรวจ 2 ฟาร์ม
      #   ถูกคัดลอกให้อัตโนมัติ) แต่ข้อมูลที่เพิ่มใหม่จะหายเมื่อ service รีสตาร์ต/ deploy ใหม่
      # - ถ้าต้องการเก็บถาวร: เปลี่ยน plan เป็น starter แล้วเพิ่ม disk ด้านล่างและเปิด LIVER_DATA_DIR
      # disk:
      #   name: liver-data
      #   mountPath: /var/data
      #   sizeGB: 1
      # - key: LIVER_DATA_DIR
      #   value: /var/data
      - key: LIVER_SECRET
        generateValue: true
      # ที่อยู่เครื่องประมวลผลในศูนย์ (เช่น https://xxx.trycloudflare.com) ใส่ในหน้า Dashboard
      - key: LIVER_ENGINE
        sync: false
